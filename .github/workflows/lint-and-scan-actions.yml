# Lint (actionlint) and security-scan (zizmor) GitHub Actions workflow files
# whenever files under .github/ change. zizmor results go to the repository's
# Security tab (code scanning); use rulesets to block merges on open alerts.

name: Lint & Scan GitHub Actions

on:
  push:
    branches: ["master", "releases/**"]
    paths: [".github/**"]
  pull_request:
    branches: ["**"]
    paths: [".github/**"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
      checks: write # github-pr-check reporter
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: reviewdog/action-actionlint@3cbf14efd750961dba35fccbf00f9e14028cb1f5 # v1.80.2
        with:
          reporter: github-pr-check
          fail_level: error

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code scanning
      contents: read # check out the repository
      actions: read # read workflow run metadata for the SARIF upload
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@f9597c869b2e67095f9b527070297a13a6efe928 # v0.7.0
