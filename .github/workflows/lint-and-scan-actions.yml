# Lint (actionlint) and security-scan (zizmor) GitHub Actions workflow files.
# Runs on every PR (no path filter) because both jobs are required status checks.
# zizmor results go to the repository's Security tab (code scanning); the
# ruleset's code scanning rule blocks merges on open alerts.

name: Lint & Scan GitHub Actions

on:
  push:
    branches: ["master", "releases/**"]
    paths: [".github/**"]
  pull_request:
    branches: ["**"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
      checks: write # github-pr-check reporter
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: reviewdog/action-actionlint@419a49378266e892f40c773b4f2fc6de9aa87499 # v1.80.4
        with:
          reporter: github-pr-check
          fail_level: error

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code scanning
      contents: read # check out the repository
      actions: read # read workflow run metadata for the SARIF upload
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          # Fork PRs get a read-only token and can't upload SARIF to code scanning;
          # report findings as annotations (and fail the job) instead.
          advanced-security: ${{ !github.event.pull_request.head.repo.fork }}
          annotations: ${{ github.event.pull_request.head.repo.fork == true }}
